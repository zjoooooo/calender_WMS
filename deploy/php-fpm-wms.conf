; WMS route & task calendar: PHP-FPM pool (section 11.4).
; deploy/install.sh copies this file to /etc/php/8.3/fpm/pool.d/wms.conf and checks it with `php-fpm8.3 -t`.
; Runs backend/public/index.php as the service user wms on a Unix socket that only Caddy can open;
; PHP-FPM never listens on a TCP port. Several workers run at once; the global flock serialises them (R36).
[wms]
user = wms
group = wms
listen = /run/php/wms.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0660
; pm = dynamic needs the three pm.*_servers values, or `php-fpm8.3 -t` fails.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
request_terminate_timeout = 30s
php_admin_value[memory_limit] = 128M
php_admin_value[date.timezone] = Asia/Singapore
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
; Request body limits, the same as Caddy's `request_body max_size 3MB` (Caddyfile). Anything Caddy lets
; through reaches the app, which applies its own limits with proper error codes: JSON bodies 1 MB
; (413 VALIDATION), JPEG 2 MB and PNG 300 KB (413 FILE_TOO_LARGE), R35 and section 12. Photos are sent as a raw
; PUT body, never as a multipart form upload.
php_admin_value[post_max_size] = 3M
php_admin_value[upload_max_filesize] = 3M
